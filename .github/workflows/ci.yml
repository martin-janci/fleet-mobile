name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # `packages: ''` because the action's default set is the wrong one: it
      # installs the newest platform and build-tools, and this build needs
      # specific ones. They are asked for by name in the next step.
      - name: Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      # compileSdk is 37. That is not a preference: Compose Multiplatform 1.12's
      # own androidx artifacts and `okhttp-android` 5.5 (which arrives through
      # Ktor) both fail their AAR-metadata check below it. The platform package
      # is spelled `android-37.0`, with the minor version — `android-37` does
      # not exist and sdkmanager will say so.
      - name: Platform 37 and build-tools 37
        run: |
          set -euo pipefail
          sdkmanager --install "platforms;android-37.0" "build-tools;37.0.0"
          sdkmanager --list_installed

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4

      # `build`, not a pair of hand-picked task names.
      #
      # The plan originally said `:shared:jvmTest :androidApp:assembleDebug`.
      # That pair is green on a tree where `Map.toSortedMap()` is used in
      # commonMain — a JVM-only extension that does not exist for Kotlin/Native,
      # so the iOS targets do not compile and neither of those two tasks is the
      # one that notices. `build` compiles every target this project declares.
      - name: ./gradlew build
        run: |
          set -euo pipefail
          ./gradlew build --stacktrace 2>&1 | tee build.log

      # Belt and braces, and it is not paranoia: on the machine this project was
      # written on, the shell wrapper in front of `gradlew` strips `e:` lines, so
      # a failing compile printed a clean-looking log. Nothing strips anything
      # here, which is exactly why the count is asserted where it can be trusted.
      - name: No compiler errors in the raw output
        run: |
          set -euo pipefail
          errors=$(grep -c '^e: ' build.log || true)
          echo "e: lines in the raw Gradle output: $errors"
          test "$errors" -eq 0

      - name: Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: androidApp-debug
          path: androidApp/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            shared/build/reports/tests/
            shared/build/test-results/
          if-no-files-found: warn

  instrumentation:
    name: AndroidSecrets on an emulator
    runs-on: ubuntu-latest

    # `AndroidSecrets` — the only thing the app persists,
    # `EncryptedSharedPreferences` over a Keystore master key — first executed
    # here on 2026-09-19 (run 35427316725, API 34): 4 tests green, including
    # that neither the key nor the token is stored in the clear. Before that it
    # had never run a line on real hardware, and this job was allowed to fail
    # without failing CI, so that a first red would not be mistaken for a code
    # fault. It has now been seen to pass, so that allowance is gone: a failure
    # here means the secure store broke, and is worth stopping for.

    steps:
      - uses: actions/checkout@v4

      - name: JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Platform 37 and build-tools 37
        run: |
          set -euo pipefail
          sdkmanager --install "platforms;android-37.0" "build-tools;37.0.0"

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4

      # The runner has the hardware but not the permission: /dev/kvm is owned by
      # a group the runner user is not in, and without it the x86_64 emulator
      # falls back to an interpreter and times out rather than failing.
      - name: Let the runner use KVM
        run: |
          set -euo pipefail
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # minSdk is 26, so any API level from 26 up exercises the same code. 34 is
      # chosen because it is the level with the most reliable x86_64 image on
      # these runners, not because the store behaves differently there.
      - name: Round-trip the secure store
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          disable-animations: true
          script: ./gradlew :shared:connectedAndroidDeviceTest --stacktrace

      - name: Instrumentation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instrumentation-reports
          path: shared/build/reports/androidTests/
          if-no-files-found: warn

  macos:
    name: iOS simulator build and test
    runs-on: macos-15

    # Two things, and it is worth being precise about which is which.
    #
    # 1. `xcodebuild` proves the Kotlin framework and the Swift host still
    #    LINK, unsigned, for the iOS Simulator SDK. It launches nothing: the
    #    `generic/platform=iOS Simulator` destination needs no simulator
    #    runtime, no Apple Developer team identifier is configured, so this is
    #    not a signed or device-capable build, and it never touches the
    #    `iphoneos` SDK.
    #
    # 2. `iosSimulatorArm64Test` RUNS the shared test suite on Kotlin/Native,
    #    on a booted simulator. Until it was added, every one of those tests
    #    had only ever executed on a JVM: `jvmTest`, and again on the
    #    emulator, because `withDeviceTestBuilder`'s `test` source-set tree
    #    pulls `commonTest` into the Android device run too. Both of those are
    #    a JVM. The one toolchain the shared code had never RUN on was the one
    #    iOS actually ships — different string, regex, coroutine and memory
    #    implementations — which was only ever compiled for.
    #
    #    It is also the only thing that has ever executed `KeychainSecrets`,
    #    and only its refusal path: the Kotlin plugin launches the test binary
    #    with `simctl spawn`, so it is not an installed app, holds no
    #    keychain-access-group entitlement, and securityd answers
    #    `errSecNotAvailable` to everything. `KeychainSecretsTest` says so at
    #    length. The round trip needs an XCTest target hosted by `iosApp` and
    #    is the one piece of iOS coverage still missing.
    #
    # Neither one runs the app's UI. See README.md → "What a Mac still has to
    # check" for what still needs a human and a real device.
    steps:
      - uses: actions/checkout@v4

      - name: JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # macos-15 carries more than one Xcode side by side; this selects the
      # newest stable one on the image rather than trusting whatever
      # `xcode-select` happens to default to. A runner-image bump can still
      # change which Xcode that is — the exact version selected is printed in
      # this step's own log.
      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4

      # `-destination 'generic/platform=iOS Simulator'` is the one destination
      # that only needs the Simulator SDK, not an installed simulator runtime
      # — the standard way to build-without-running on a runner that may not
      # have any runtime cached. `ARCHS=arm64` because `shared/build.gradle.kts`
      # deliberately has no `iosX64()` target (Compose Multiplatform stopped
      # publishing that variant after 1.10.3): the SDK's default `ARCHS_STANDARD`
      # also includes `x86_64`, and Compose's resource-sync task fails outright
      # on an arch nothing was built for. `CODE_SIGNING_ALLOWED=NO` and no team
      # identifier below: nobody has a signing identity here, and this builds —
      # it does not sign, archive, or run.
      - name: xcodebuild (iOS Simulator, unsigned)
        working-directory: iosApp
        run: |
          set -euo pipefail
          xcodebuild -project iosApp.xcodeproj -scheme iosApp -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=NO CODE_SIGNING_ALLOWED=NO build

      # The Keychain round trip, in an app bundle.
      #
      # `iosSimulatorArm64Test` below runs the shared suite but CANNOT do this
      # one: the Kotlin plugin launches that binary with `simctl spawn`, so it
      # is not an installed app, holds no keychain-access-group entitlement, and
      # securityd answers `errSecNotAvailable` (-25291) to every request.
      # `KeychainSecretsTest` asserts that refusal and says so at length.
      #
      # An XCTest bundle hosted by `iosApp` is loaded into the app's process and
      # runs under the app's identifier and entitlements, which is the same
      # difference that lets Android's instrumentation test do the round trip.
      # This is the only thing that has ever stored and read back a real
      # Keychain item for this app.
      #
      # A concrete destination, not `generic/`: this one boots a simulator and
      # runs. The device is discovered rather than named, because the set
      # installed on the runner image changes.
      - name: Keychain round trip on a booted simulator
        working-directory: iosApp
        run: |
          set -euo pipefail
          device=$(xcrun simctl list devices available --json \
            | python3 -c "import json,sys;d=json.load(sys.stdin)['devices'];\
          print(next(x['udid'] for k in sorted(d) if 'iOS' in k for x in d[k] if x.get('isAvailable')))")
          echo "simulator: $device"
          set -o pipefail
          # Signed ad-hoc, unlike the build-only step above, and that is the
          # whole difference between this working and not.
          #
          # Keychain access needs an `application-identifier` entitlement, and
          # entitlements come from signing. Built with `CODE_SIGNING_ALLOWED=NO`
          # the app launches fine and every Keychain call returns
          # `errSecMissingEntitlement` (**-34018**) — measured, in the run before
          # this line existed. A simulator needs no developer identity for this:
          # `-` is the ad-hoc identity, and the entitlement it synthesises is the
          # bundle id, which is exactly what a signed app gets on a device. So
          # this is representative rather than a special case.
          #
          # `DEVELOPMENT_TEAM` stays empty and no profile is specified: still no
          # signed, device-capable build here, and `CiWorkflowTest` still refuses
          # a team identifier anywhere in this file.
          xcodebuild test -project iosApp.xcodeproj -scheme iosApp -configuration Debug \
            -destination "platform=iOS Simulator,id=$device" \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=YES CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY="-" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            2>&1 | tee "$RUNNER_TEMP/xcodebuild-test.log"

      # Uploaded whether or not the step above passed. An `xcodebuild test`
      # failure is most legible as its own output, and an artifact is cheaper to
      # fetch than a job log.
      - name: iOS test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-xctest-log
          path: ${{ runner.temp }}/xcodebuild-test.log
          if-no-files-found: warn

      # The shared suite, on Kotlin/Native rather than on the JVM.
      #
      # This is the job that makes the iOS half of "one codebase, two platforms"
      # a tested claim instead of a compiled one. `./gradlew build` on the Linux
      # runner compiles the iOS targets — that is what catches a JVM-only API in
      # commonMain — but it cannot RUN them: `iosSimulatorArm64Test` is disabled
      # off macOS, and Gradle says so in a warning that is easy to read as
      # routine. So every assertion about the address parser, the SSE framing,
      # the conversation merge, the view models' coroutine behaviour and the
      # token-hygiene rules were asserted on a JVM only — twice over, since
      # the emulator job runs `commonTest` too, but both are a JVM — and the
      # toolchain iOS actually ships was the one nothing ever ran.
      #
      # `:shared:iosSimulatorArm64Test` is listed by name rather than reached
      # through `check`: the Xcode build above is this job's other half and
      # `check` would drag the JVM and Android work onto a macOS runner for
      # nothing, since the `build` job already did it.
      #
      # The Kotlin Gradle plugin boots and shuts a simulator itself (standalone
      # mode); the runner image carries the runtimes.
      - name: Shared test suite on Kotlin/Native
        run: |
          set -euo pipefail
          xcrun simctl list runtimes
          ./gradlew :shared:iosSimulatorArm64Test --stacktrace

      - name: Kotlin/Native test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-test-reports
          path: |
            shared/build/reports/tests/
            shared/build/test-results/
          if-no-files-found: warn

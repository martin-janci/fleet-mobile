name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # `packages: ''` because the action's default set is the wrong one: it
      # installs the newest platform and build-tools, and this build needs
      # specific ones. They are asked for by name in the next step.
      - name: Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      # compileSdk is 37. That is not a preference: Compose Multiplatform 1.12's
      # own androidx artifacts and `okhttp-android` 5.5 (which arrives through
      # Ktor) both fail their AAR-metadata check below it. The platform package
      # is spelled `android-37.0`, with the minor version — `android-37` does
      # not exist and sdkmanager will say so.
      - name: Platform 37 and build-tools 37
        run: |
          set -euo pipefail
          sdkmanager --install "platforms;android-37.0" "build-tools;37.0.0"
          sdkmanager --list_installed

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4

      # `build`, not a pair of hand-picked task names.
      #
      # The plan originally said `:shared:jvmTest :androidApp:assembleDebug`.
      # That pair is green on a tree where `Map.toSortedMap()` is used in
      # commonMain — a JVM-only extension that does not exist for Kotlin/Native,
      # so the iOS targets do not compile and neither of those two tasks is the
      # one that notices. `build` compiles every target this project declares.
      - name: ./gradlew build
        run: |
          set -euo pipefail
          ./gradlew build --stacktrace 2>&1 | tee build.log

      # Belt and braces, and it is not paranoia: on the machine this project was
      # written on, the shell wrapper in front of `gradlew` strips `e:` lines, so
      # a failing compile printed a clean-looking log. Nothing strips anything
      # here, which is exactly why the count is asserted where it can be trusted.
      - name: No compiler errors in the raw output
        run: |
          set -euo pipefail
          errors=$(grep -c '^e: ' build.log || true)
          echo "e: lines in the raw Gradle output: $errors"
          test "$errors" -eq 0

      - name: Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: androidApp-debug
          path: androidApp/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            shared/build/reports/tests/
            shared/build/test-results/
          if-no-files-found: warn

  instrumentation:
    name: AndroidSecrets on an emulator
    runs-on: ubuntu-latest

    # `AndroidSecrets` — the only thing the app persists,
    # `EncryptedSharedPreferences` over a Keystore master key — first executed
    # here on 2026-09-19 (run 35427316725, API 34): 4 tests green, including
    # that neither the key nor the token is stored in the clear. Before that it
    # had never run a line on real hardware, and this job was allowed to fail
    # without failing CI, so that a first red would not be mistaken for a code
    # fault. It has now been seen to pass, so that allowance is gone: a failure
    # here means the secure store broke, and is worth stopping for.

    steps:
      - uses: actions/checkout@v4

      - name: JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Platform 37 and build-tools 37
        run: |
          set -euo pipefail
          sdkmanager --install "platforms;android-37.0" "build-tools;37.0.0"

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4

      # The runner has the hardware but not the permission: /dev/kvm is owned by
      # a group the runner user is not in, and without it the x86_64 emulator
      # falls back to an interpreter and times out rather than failing.
      - name: Let the runner use KVM
        run: |
          set -euo pipefail
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # minSdk is 26, so any API level from 26 up exercises the same code. 34 is
      # chosen because it is the level with the most reliable x86_64 image on
      # these runners, not because the store behaves differently there.
      - name: Round-trip the secure store
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          disable-animations: true
          script: ./gradlew :shared:connectedAndroidDeviceTest --stacktrace

      - name: Instrumentation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instrumentation-reports
          path: shared/build/reports/androidTests/
          if-no-files-found: warn

name: Release

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    name: Build, sign, and publish the release APK
    runs-on: ubuntu-latest
    # Only this job gets the write scope, and only to create the release —
    # nothing else in this workflow needs it.
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      # `github.ref_name` is the pushed tag, which is attacker-controlled input
      # (anyone who can push a tag chooses this string) — it is never
      # interpolated directly into a `run:` body. It arrives here through
      # `env:` and is validated before anything downstream sees it: digits and
      # dots, with an optional `-suffix` of `[0-9A-Za-z.-]`. `VERSION_NAME` is
      # what `assembleRelease` gets as `-PversionName`.
      - name: Validate the tag and derive the version name
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [[ ! "$TAG" =~ ^v[0-9]+(\.[0-9]+)*(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::tag '$TAG' is not a valid vX.Y.Z[-suffix] release tag" >&2
            exit 1
          fi
          version="${TAG#v}"
          echo "name=$version" >> "$GITHUB_OUTPUT"

      # Fail before building rather than after: a release build must never
      # ship unsigned or fall back to the debug key, so the absence of any one
      # of these four is a hard stop. Only the names are logged, never values.
      - name: Require the signing secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          missing=()
          [[ -z "$ANDROID_KEYSTORE_BASE64" ]] && missing+=("ANDROID_KEYSTORE_BASE64")
          [[ -z "$ANDROID_KEYSTORE_PASSWORD" ]] && missing+=("ANDROID_KEYSTORE_PASSWORD")
          [[ -z "$ANDROID_KEY_ALIAS" ]] && missing+=("ANDROID_KEY_ALIAS")
          [[ -z "$ANDROID_KEY_PASSWORD" ]] && missing+=("ANDROID_KEY_PASSWORD")
          if [[ ${#missing[@]} -gt 0 ]]; then
            echo "::error::missing secret(s): ${missing[*]} — a release build must be signed, so this workflow refuses to continue" >&2
            exit 1
          fi

      - name: JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # `packages: ''` because the action's default set is the wrong one; see
      # the same step in ci.yml.
      - name: Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Platform 37 and build-tools 37
        run: |
          set -euo pipefail
          sdkmanager --install "platforms;android-37.0" "build-tools;37.0.0"

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4

      # A tag on an untested commit must not publish. This is the same
      # `./gradlew build` ci.yml runs on every push — it receives none of the
      # four signing secrets, since verifying the source has nothing to do
      # with signing it.
      - name: ./gradlew build
        run: |
          set -euo pipefail
          ./gradlew build --stacktrace 2>&1 | tee build.log

      # Belt and braces, same as ci.yml: the shell wrapper in front of
      # `gradlew` on some machines strips `e:` lines, so a failing compile can
      # print a clean-looking log. Nothing strips anything here.
      - name: No compiler errors in the raw output
        run: |
          set -euo pipefail
          errors=$(grep -c '^e: ' build.log || true)
          echo "e: lines in the raw Gradle output: $errors"
          test "$errors" -eq 0

      # Decoded under $RUNNER_TEMP, never inside the workspace: the workspace
      # is what `actions/checkout` populated and is not a safe place for a
      # signing key, however briefly. Removed again in the always()-guarded
      # cleanup step below regardless of what happens after this point.
      - name: Decode the keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          chmod 600 "$RUNNER_TEMP/release.jks"

      # The four signing values reach Gradle through `env:` on this one step,
      # not as `-P` command-line arguments — a process list and the Gradle
      # console log both would otherwise carry them. `androidApp/build.gradle.kts`
      # reads these same four names from the environment to build the `release`
      # signing config.
      - name: Build the signed release APK
        env:
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          VERSION_NAME: ${{ steps.version.outputs.name }}
          VERSION_CODE: ${{ github.run_number }}
        run: |
          set -euo pipefail
          # `GITHUB_SHA` (the runner's own) becomes BuildConfig.GIT_SHA, the
          # `build` part of the X-Fleet-Client header the hub reads.
          ./gradlew :androidApp:assembleRelease \
            -PversionName="$VERSION_NAME" \
            -PversionCode="$VERSION_CODE" \
            -PgitSha="$GITHUB_SHA" \
            --stacktrace

      # A signing config that silently failed to apply (a bad path, an AGP
      # DSL slip) would still leave `hasReleaseSigning` producing an unsigned
      # APK that built successfully. This is the check that turns that into a
      # failed release rather than a published one.
      #
      # `apksigner`'s location isn't hard-coded: which of ANDROID_HOME /
      # ANDROID_SDK_ROOT the setup-android action actually exports isn't
      # documented as stable, so this tries both, then falls back to PATH,
      # and picks the newest build-tools version under whichever root has
      # one rather than assuming 37.0.0 stays the only one installed.
      - name: Verify the APK is signed
        id: verify
        run: |
          set -euo pipefail
          apk="androidApp/build/outputs/apk/release/androidApp-release.apk"
          if [[ ! -f "$apk" ]]; then
            echo "::error::expected APK not found at $apk" >&2
            exit 1
          fi

          find_apksigner() {
            local root newest
            for root in "${ANDROID_HOME:-}" "${ANDROID_SDK_ROOT:-}"; do
              if [[ -n "$root" && -d "$root/build-tools" ]]; then
                newest=$(ls -d "$root"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -1)
                if [[ -n "$newest" ]]; then
                  echo "$newest"
                  return 0
                fi
              fi
            done
            if command -v apksigner >/dev/null 2>&1; then
              command -v apksigner
              return 0
            fi
            return 1
          }

          apksigner_bin="$(find_apksigner)" || {
            echo "::error::apksigner not found under ANDROID_HOME, ANDROID_SDK_ROOT, or PATH" >&2
            exit 1
          }

          "$apksigner_bin" verify --print-certs "$apk" | tee certs.txt
          # The signing certificate's sha256, for the hub's decision: a phone
          # refuses an APK not signed with exactly this certificate.
          # apksigner names the signer `Signer #1` when the APK carries a v1
          # (JAR) signature and `V2 Signer` / `V3 Signer` when it carries
          # only the newer schemes (minSdk >= 24), as our release APK does.
          signer=$(sed -nE 's/^(Signer #1|V[0-9]+ Signer:) certificate SHA-256 digest: *([0-9a-f]{64})$/\2/p' certs.txt | head -1)
          if [[ -z "$signer" ]]; then
            echo "::error::apksigner printed no SHA-256 digest for the signer" >&2
            exit 1
          fi
          echo "signer=$signer" >> "$GITHUB_OUTPUT"

      # The versioned name the update channel points at, beside the old
      # `androidApp-release.apk` that installed phones still look for on
      # GitHub, and a SHA256SUMS for both.
      - name: Name the APK and sum it
        id: apk
        env:
          VERSION_NAME: ${{ steps.version.outputs.name }}
        run: |
          set -euo pipefail
          cd androidApp/build/outputs/apk/release
          cp androidApp-release.apk "fleet-mobile-$VERSION_NAME.apk"
          sha256sum "fleet-mobile-$VERSION_NAME.apk" androidApp-release.apk > SHA256SUMS
          cat SHA256SUMS
          echo "sha256=$(sha256sum "fleet-mobile-$VERSION_NAME.apk" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "size=$(stat -c %s "fleet-mobile-$VERSION_NAME.apk")" >> "$GITHUB_OUTPUT"

      # `gh` is preinstalled on the runner and uses `GITHUB_TOKEN` — no
      # third-party release action needed.
      - name: Publish the release
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION_NAME: ${{ steps.version.outputs.name }}
        run: |
          set -euo pipefail
          out=androidApp/build/outputs/apk/release
          gh release create "$TAG" \
            --title "$TAG" \
            --generate-notes \
            "$out/fleet-mobile-$VERSION_NAME.apk" \
            "$out/androidApp-release.apk" \
            "$out/SHA256SUMS"

      # claude-fleet signs the phone's part of its release as an amendment
      # (its `android-amendment.yml`); this tells it what was published. A
      # fine-grained token with Contents: write on claude-fleet only, never
      # this workflow's own GITHUB_TOKEN (which cannot dispatch to another
      # repository). Without the secret the release still stands and the
      # amendment can be run by hand there.
      - name: Tell claude-fleet
        env:
          FLEET_DISPATCH_TOKEN: ${{ secrets.FLEET_DISPATCH_TOKEN }}
          REPO: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
          VERSION_NAME: ${{ steps.version.outputs.name }}
          VERSION_CODE: ${{ github.run_number }}
          SHA256: ${{ steps.apk.outputs.sha256 }}
          SIZE: ${{ steps.apk.outputs.size }}
          SIGNER: ${{ steps.verify.outputs.signer }}
        run: |
          set -euo pipefail
          if [[ -z "$FLEET_DISPATCH_TOKEN" ]]; then
            echo "::notice::FLEET_DISPATCH_TOKEN is not set: run claude-fleet's android-amendment workflow by hand for $VERSION_NAME"
            exit 0
          fi
          contract() {
            sed -n "s/^const val $1: Int = \([0-9]\+\)$/\1/p" shared/src/commonMain/kotlin/dev/claudefleet/mobile/net/HubContract.kt
          }
          cmin=$(contract MIN_HUB_CONTRACT)
          cmax=$(contract MAX_HUB_CONTRACT)
          if [[ -z "$cmin" || -z "$cmax" ]]; then
            echo "::error::could not read the contract window from HubContract.kt" >&2
            exit 1
          fi
          GH_TOKEN="$FLEET_DISPATCH_TOKEN" gh api "repos/$OWNER/claude-fleet/dispatches" \
            -f event_type=android-release \
            -f "client_payload[version]=$VERSION_NAME" \
            -f "client_payload[apk_url]=https://github.com/$REPO/releases/download/v$VERSION_NAME/fleet-mobile-$VERSION_NAME.apk" \
            -f "client_payload[sha256]=$SHA256" \
            -f "client_payload[size]=$SIZE" \
            -f "client_payload[version_code]=$VERSION_CODE" \
            -f "client_payload[signer_sha256]=$SIGNER" \
            -f "client_payload[contract_min]=$cmin" \
            -f "client_payload[contract_max]=$cmax"

      - name: Remove the decoded keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

[versions]
agp = "9.4.0"
kotlin = "2.4.20"
compose-multiplatform = "1.12.0"
# Compose Multiplatform material3 is versioned independently of the rest of CMP.
compose-material3 = "1.9.0"
coroutines = "1.11.0"
serialization = "1.11.0"
ktor = "3.6.0"
androidx-activity-compose = "1.13.0"
androidx-security-crypto = "1.1.0"
# CameraX 1.7 is alpha-only; 1.6.2 is the newest stable final.
androidx-camera = "1.6.2"
# ZXing, not ML Kit. Measured on the debug runtime classpath:
# com.google.mlkit:barcode-scanning:17.3.0 pulls play-services-basement, -base,
# -tasks, play-services-mlkit-barcode-scanning, three Firebase encoder artifacts
# and transport-backend-cct (Google's Cloud Client Telemetry uploader), and took
# the debug APK from 14 MB to 40 MB. A phone paired to a self-hosted hub should
# not have to carry a Google telemetry client to read one QR code, and may have
# no Play Services at all. ZXing is pure Java and talks to nobody.
zxing = "3.5.4"

# The instrumentation test for `AndroidSecrets`. Device-only: everything it
# exercises — the Keystore, `EncryptedSharedPreferences`, the on-disk prefs file
# — exists on a device or an emulator and nowhere else.
androidx-test = "1.7.0"
androidx-test-junit = "1.3.0"

# 37 is forced by the current stable AndroidX/Compose/OkHttp artifacts, which
# refuse a lower compileSdk. targetSdk stays at 35: the app is not yet tested
# against the newer runtime behaviour changes.
android-compileSdk = "37"
android-minSdk = "26"
android-targetSdk = "35"

[libraries]
compose-runtime = { module = "org.jetbrains.compose.runtime:runtime", version.ref = "compose-multiplatform" }
compose-foundation = { module = "org.jetbrains.compose.foundation:foundation", version.ref = "compose-multiplatform" }
compose-ui = { module = "org.jetbrains.compose.ui:ui", version.ref = "compose-multiplatform" }
# The multiplatform BackHandler (`androidx.compose.ui.backhandler`), published
# separately from `ui`. Measured, not assumed: it is ALREADY on the runtime
# classpath — `material3` 1.9.1 depends on `ui-backhandler` 1.9.1, which the
# atomic-group constraint lifts to 1.12.0 — so declaring it adds nothing to the
# APK (byte-identical at 20,294,236 B before and after) and only makes the
# package visible to `commonMain`.
compose-ui-backhandler = { module = "org.jetbrains.compose.ui:ui-backhandler", version.ref = "compose-multiplatform" }
compose-material3 = { module = "org.jetbrains.compose.material3:material3", version.ref = "compose-material3" }

kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }

ktor-client-core = { module = "io.ktor:ktor-client-core", version.ref = "ktor" }
ktor-client-okhttp = { module = "io.ktor:ktor-client-okhttp", version.ref = "ktor" }
ktor-client-darwin = { module = "io.ktor:ktor-client-darwin", version.ref = "ktor" }
ktor-client-mock = { module = "io.ktor:ktor-client-mock", version.ref = "ktor" }

androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidx-activity-compose" }
androidx-security-crypto = { module = "androidx.security:security-crypto", version.ref = "androidx-security-crypto" }

# The QR scanner: CameraX for the preview and the frames, ZXing for the decode.
androidx-camera-camera2 = { module = "androidx.camera:camera-camera2", version.ref = "androidx-camera" }
androidx-camera-lifecycle = { module = "androidx.camera:camera-lifecycle", version.ref = "androidx-camera" }
androidx-camera-view = { module = "androidx.camera:camera-view", version.ref = "androidx-camera" }
zxing-core = { module = "com.google.zxing:core", version.ref = "zxing" }

androidx-test-core = { module = "androidx.test:core", version.ref = "androidx-test" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidx-test" }
androidx-test-ext-junit = { module = "androidx.test.ext:junit", version.ref = "androidx-test-junit" }

[plugins]
androidApplication = { id = "com.android.application", version.ref = "agp" }
androidKotlinMultiplatformLibrary = { id = "com.android.kotlin.multiplatform.library", version.ref = "agp" }
kotlinMultiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlinSerialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
composeCompiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
composeMultiplatform = { id = "org.jetbrains.compose", version.ref = "compose-multiplatform" }
